[package]
name = "harness-durable"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "Capture coding-agent sessions into portable Lance archives"
license = "Apache-2.0"

[dependencies]
anyhow = "1"
async-trait = "0.1"
aws-config = "1"
aws-credential-types = "1"
arrow-array = "58"
arrow-json = "58"
arrow-schema = "58"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
directories = "6"
fs2 = "0.4"
futures = "0.3"
lance = { version = "=12.0.0", default-features = false }
lance-file = "=12.0.0"
lance-index = "=12.0.0"
notify = "8"
object_store = { version = "0.14", features = ["aws"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
toml = "0.9"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
tempfile = "3"

[profile.dev]
debug = 0

[profile.test]
debug = 0
