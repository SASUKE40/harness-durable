# Paths are literal: use absolute paths (TOML does not expand ~ or $HOME).
state_dir = "/absolute/path/to/.harness-durable"
flush_seconds = 5
max_records = 1000
max_bytes = 8388608
rescan_seconds = 30

# Omit sources to discover the standard Codex, Pi, and Cursor directories.
# Entries override default roots for that harness.
# [[sources]]
# harness = "pi"
# path = "/absolute/path/to/sessions"

# Leave remotes absent for local-only capture. Configured remotes are synced
# automatically by import/watch, or explicitly with `sync`.
# [[remotes]]
# name = "s3"
# kind = "s3"
# bucket = "my-private-session-archive"
# prefix = "harness"
# region = "us-west-2"

# S3-compatible local testing or direct R2 access:
# endpoint = "http://127.0.0.1:5000"
# allow_http = true

# [[remotes]]
# name = "cloudflare"
# kind = "cloudflare"
# url = "https://harness-durable.YOUR-SUBDOMAIN.workers.dev"
# archive = "personal"
# token_env = "HARNESS_DURABLE_TOKEN"

# Optional trajectory feedback. Defaults use native Jev decisions and Opus reports.
# `compare --dry-run` aligns locally without API keys or model requests.
# [feedback]
# matching = "bm25" # bm25 | strict | unordered | required
# dimensions = ["tool_correctness", "progress"] # [] for quality-only requests
# min_similarity = 0.1
# max_steps = 2000
# max_prompt_bytes = 1048576
# rubric = "Correctness, useful progress, and consistency with observed evidence."
#
# [feedback.judge]
# protocol = "typesafe"
# endpoint = "https://api.typesafe.ai/v1/systemone"
# model = "jev-1.13.0"
# token_env = "TYPESAFE_API_KEY"
#
# [feedback.reporter]
# protocol = "anthropic"
# endpoint = "https://api.anthropic.com/v1/messages"
# model = "claude-opus-5-5"
# token_env = "ANTHROPIC_API_KEY"
# max_tokens = 16384
#
# Other text judges/reporters can use protocol = "chat_completions" and a full
# /v1/chat/completions endpoint. `typesafe` is supported only as the judge.
